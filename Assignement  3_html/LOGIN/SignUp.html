<html>
    <head>
        <title>Sign Up page</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div class="signup">
        <h4>Register to have access to the System features</h4>
        <pre>
            <form action="SignUp.php" method="post">
    <input type="text" placeholder="First Name" name="Fname" id="input" required>

    <input type="text" placeholder="Last Name" name="Lname" id="input" required>

    <input type="email" placeholder="Email" name="email" id="input" required>

    <input type="tel" placeholder="Telephone number" name="tel" id="input" required>

    <input type="text" placeholder="Role" name="role" id="input" required>

    <input type="text" placeholder="Prefered Username" name="username" id="input" required>

    <input type="password" placeholder="Password" name="password" id="input" required>

    <input type="password" placeholder="Confirm password" name="cpassword" id="input" required>
    <p id="pword-error" style="color: red; font-size: 10px; margin: 2px 0 10px 0; display: none;">
        Passwords do not match. Please try again.
    </p>
                <input type="submit" value="Sign Up" name="submit" id="submit">
                <p id="link">Already have an Account? <a href="Login.html">Login</a></p>
            </form>
        </pre>
        </div>
        <script>
            const params=new URLSearchParams(window.location.search);
            if(params.get('error')==='password'){
                document.getElementById('pword-error').style.display='block';
            }
        </script>
    </body>
</html>
